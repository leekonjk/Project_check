limit_req_zone $binary_remote_addr zone=football:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=football_auth:10m rate=10r/m;
server {
    listen 80;
    server_tokens off;
    root /app/public;
    client_max_body_size 16k;
    limit_req_status 429;

    location ~ ^/(login|register|admin/login|api/v1/auth/(login|register))$ {
        limit_req zone=football_auth burst=5 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass php:9000;
    }

    location = /style.css {
        try_files $uri =404;
    }

    location / {
        limit_req zone=football burst=30 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass php:9000;
    }
}
